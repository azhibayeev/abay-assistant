# LLM-as-judge сценарии для inbox-flow.
# Запуск: RUN_LLM_SCENARIOS=1 .venv/bin/python -m pytest tests/scenarios/ -v
#
# Структура:
#   name: уникальное имя
#   description: что проверяет
#   role: owner | assistant
#   message: что пишет пользователь
#   board: {колонка: [{name, ...}]} — начальное состояние Trello
#   expectations: список строк-ожиданий, каждое судья оценивает отдельно

- name: completion_pattern_meeting
  description: «Сделал X» закрывает существующую карточку и переносит в ГОТОВО
  role: assistant
  message: "Сделал Абеке, инвест линия"
  board:
    "сегодня":
      - name: "Встреча с Абеке по инвест-линии"
        desc: "Контекст: возникла из обсуждения апайки и цирка"
  expectations:
    - "Бот вызвал find_trello_card или get_trello_cards чтобы найти карточку про Абеке/инвест"
    - "Бот вызвал move_trello_card с target_list='ГОТОВО' для карточки 'Встреча с Абеке по инвест-линии'"
    - "Бот НЕ вызвал move_trello_card в 'Мяч на стороне' — это для делегированных задач, не для завершённых"
    - "В финальном тексте ответа упомянуто имя карточки (Абеке/инвест-линия)"
    - "Бот не задавал уточняющих вопросов вида 'какая задача была сделана?' или 'есть ли следующие шаги?'"
    - "В колонке ГОТОВО после прогона есть карточка про Абеке"

- name: duplicate_guard_blocks_create
  description: При попытке создать дубль — fuzzy-защита возвращает possible_duplicate, бот обновляет существующую
  role: owner
  message: "запиши задачу — встреча с Абеке по инвестициям, на завтра"
  board:
    "сегодня":
      - name: "Встреча с Абеке по инвест-линии"
        desc: "Уже стоит"
  expectations:
    - "Бот НЕ создал новую карточку про Абеке (нет финального create_trello_card или была попытка create_trello_card, но она вернула possible_duplicate и бот не повторил с force=true)"
    - "Бот среагировал на ситуацию ЛЮБЫМ из этих способов (достаточно ОДНОГО): (a) обновил существующую через update_trello_card/add_trello_comment, (b) поставил reminder через set_reminder, (c) задал уточняющий вопрос пользователю — через tool request_clarification ИЛИ просто финальным текстом-вопросом. Любой из этих трёх вариантов считается выполнением ожидания."
    - "В колонке 'сегодня' после прогона ровно ОДНА карточка про Абеке (не две)"

- name: simple_create_new_task
  description: Совершенно новая задача — должна создаться без помех
  role: owner
  message: "запиши задачу: подготовить квартальный отчёт для совета директоров до 15 мая"
  board:
    "сегодня": []
    "неделя": []
  expectations:
    - "Бот вызвал create_trello_card с осмысленным name (про отчёт/совет директоров)"
    - "В аргументах есть label (зона) и desc (контекст)"
    - "После прогона на доске появилась новая карточка про отчёт"

- name: delegated_to_someone
  description: Делегированная задача → Мяч на стороне с ответственным через тире
  role: owner
  message: "передал Аксу подготовить материалы для тик-тока, пусть сделает к пятнице"
  board:
    "сегодня": []
  expectations:
    - "Бот создал или нашёл карточку про материалы для тик-тока"
    - "Карточка оказалась в колонке 'Мяч на стороне' (либо move_trello_card в 'Мяч на стороне', либо сразу create_trello_card с list_name='Мяч на стороне')"
    - "Имя карточки содержит '— Аксу' (тире и имя ответственного), либо бот вызвал rename_trello_card чтобы добавить ответственного"

- name: set_reminder_natural_time
  description: «напомни завтра в 10» → set_reminder с правильным datetime
  role: owner
  message: "напомни завтра в 10 утра позвонить Расулу"
  board: {}
  expectations:
    - "Бот вызвал set_reminder с осмысленным text про звонок Расулу"
    - "Аргумент remind_at — ISO datetime на завтра, 10:00 (часы=10, минуты=00). Год/месяц/день — следующий день относительно сегодня."

- name: update_existing_card_progress
  description: «по DMS — обсудили цену» → find существующей карточки + add_comment, БЕЗ create
  role: owner
  message: "по DMS дискавери — обсудили с Маратом цену 500к, готов согласовать"
  board:
    "неделя":
      - name: "DMS дискавери — партнёрство"
        desc: "обсуждение партнёрства с Маратом"
  expectations:
    - "Бот НЕ создал новую карточку через create_trello_card"
    - "Бот вызвал find_trello_card или get_trello_cards и нашёл существующую DMS-карточку"
    - "Бот вызвал add_trello_comment к найденной карточке с упоминанием цены 500к / Марата / согласования"
    - "На доске после прогона осталась ровно ОДНА карточка про DMS"

- name: new_person_one_question
  description: Упомянут новый человек → save_entity_note + ОДИН уточняющий вопрос (не 5)
  role: owner
  message: "созвонился с новым партнёром Талғатом по теме экспорта"
  board: {}
  expectations:
    - "Бот вызвал save_entity_note для person 'Талғат' с осмысленным content"
    - "В финальном тексте бот задал ровно ОДИН уточняющий вопрос (например про роль/компанию/проект Талгата) — не два или больше"
    - "Бот упомянул в ответе, что запомнил Талгата (например '🧠 запомнил' или эквивалент)"

- name: urgent_creates_red_cover
  description: «срочно X» → create + set_cover='red' (приоритет горит)
  role: owner
  message: "срочно: подготовить презентацию для Кудрета на завтра, ВГ-проект"
  board: {}
  expectations:
    - "Бот вызвал create_trello_card с label равным одной из зон (Стратегия / B2B / B2G / Команда / Финансы / Продукт / Личное)"
    - "Бот вызвал set_trello_card_cover с color='red' для созданной карточки (либо явно red — потому что слово 'срочно' и дедлайн на завтра)"
    - "Если установлен due — это завтра (дата ровно на 1 день вперёд от сегодня)"

- name: move_existing_to_next_week
  description: «перенеси X на следующую неделю» → find + move в Неделя
  role: owner
  message: "перенеси «Звонок с Расулом» на следующую неделю"
  board:
    "сегодня":
      - name: "Звонок с Расулом по продукту"
        desc: "обсудить roadmap"
  expectations:
    - "Бот вызвал find_trello_card или get_trello_cards чтобы найти карточку про Расула"
    - "Бот вызвал move_trello_card с target_list, содержащим 'неделя' (или 'Неделя')"
    - "После прогона карточка «Звонок с Расулом по продукту» НЕ в колонке 'сегодня'"
