[project]
name = "abay-assistant"
version = "0.1.0"
description = "AI-ассистент Абая — Telegram-бот с LLM, Trello, Calendar и Obsidian"
requires-python = ">=3.11"
dependencies = [
    "aiogram~=3.15",
    "sqlmodel",
    "pydantic-settings",
    "httpx",
    "anthropic",
    "google-api-python-client",
    "google-auth-oauthlib",
    "apscheduler~=3.10",
    "loguru",
    "python-dotenv",
    "openai",
    "pyyaml",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abay_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
